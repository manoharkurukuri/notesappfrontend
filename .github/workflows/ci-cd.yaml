name: frontend-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test runtime configuration
        run: npm test

      - name: Build frontend
        run: npm run build

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker-build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mkurukuri/notes-frontend:${{ github.run_id }}-${{ github.run_attempt }}

  update-helm-image-tag:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: manoharkurukuri/devops-helm
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update frontend image tag in dev override
        env:
          IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ruby -ryaml -e '
            path = "helm-notes-app/environments/dev/frontend.yaml"
            data = YAML.load_file(path)
            abort "Missing frontend map" unless data.is_a?(Hash) && data["frontend"].is_a?(Hash)
            image = data["frontend"]["image"]
            abort "Missing frontend.image.tag" unless image.is_a?(Hash) && image.key?("tag")
            image["tag"] = ENV.fetch("IMAGE_TAG")
            File.write(path, YAML.dump(data))
          '

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0

      - name: Validate GitOps chart with dev overrides
        run: |
          helm lint helm-notes-app --strict \
            -f helm-notes-app/environments/dev/frontend.yaml \
            -f helm-notes-app/environments/dev/backend.yaml
          helm template fullstack helm-notes-app --namespace devops-app \
            -f helm-notes-app/environments/dev/frontend.yaml \
            -f helm-notes-app/environments/dev/backend.yaml > /dev/null

      - name: Commit and push chart update
        env:
          IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-notes-app/environments/dev/frontend.yaml
          if git diff --cached --quiet; then
            echo "No image tag change to commit"
            exit 0
          fi
          git commit -m "ci: deploy frontend image ${IMAGE_TAG}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::GitOps push attempt ${attempt} failed"
          done
          echo "::error::Unable to push frontend image update"
          exit 1