name: helm-check

on:
  push:
    branches: [main]
    paths:
      - "helm/notesappfrontend/**"
      - ".github/workflows/helm-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "helm/notesappfrontend/**"
      - ".github/workflows/helm-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0

      - name: Lint and render chart
        run: |
          helm lint helm/notesappfrontend --strict
          helm template notesappfrontend helm/notesappfrontend > /dev/null
          helm template notesappfrontend helm/notesappfrontend --set autoscaling.enabled=true > /dev/null
          helm template notesappfrontend helm/notesappfrontend --set ingress.enabled=true > /dev/null
          helm template notesappfrontend helm/notesappfrontend --set httpRoute.enabled=true > /dev/null
