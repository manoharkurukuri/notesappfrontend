name: frontend-ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/notesappfrontend/**"
      - ".github/workflows/helm-check.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "helm/notesappfrontend/**"
      - ".github/workflows/helm-check.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker-build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mkurukuri/notesappfrontend:${{ github.run_id }}

  update-helm-image-tag:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update only image.tag in Helm values
        env:
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          ruby -ryaml -e '
            path = "helm/notesappfrontend/values.yaml"
            data = YAML.load_file(path)
            abort "values.yaml has no image map" unless data.is_a?(Hash) && data["image"].is_a?(Hash)
            abort "values.yaml has no image.tag" unless data["image"].key?("tag")
            data["image"]["tag"] = ENV.fetch("IMAGE_TAG")
            File.write(path, YAML.dump(data))
          '

      - name: Commit and push chart update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/notesappfrontend/values.yaml
          if git diff --cached --quiet; then
            echo "No image tag change to commit"
            exit 0
          fi
          git commit -m "ci: deploy image ${{ github.run_id }}"
          git push origin HEAD:main